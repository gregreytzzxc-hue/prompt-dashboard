<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Hub Pro</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <h2>Prompt Hub</h2>
        <button class="toggle-btn" onclick="toggleSidebar()">✕</button>
    </div>

    <button onclick="showTab('home')" class="nav-btn">🏠 الرئيسية</button>
    <button onclick="showTab('prompts')" class="nav-btn">📝 البرومبتات</button>
    <button onclick="showTab('categories')" class="nav-btn">📂 الأقسام</button>
    <button onclick="showTab('notifications')" class="nav-btn">🔔 الإشعارات</button>
    <button onclick="showTab('settings')" class="nav-btn">⚙️ الإعدادات</button>

    <div class="sidebar-footer">
        <button onclick="toggleTheme()" id="theme-btn">🌙</button>
    </div>
</div>

<!-- MAIN -->
<div class="main">

    <!-- HOME -->
    <div id="home" class="tab active">
        <h1 class="page-title">الرئيسية</h1>
        <div id="stats" class="stats-grid"></div>
        <div class="grid" id="homeGrid"></div>
    </div>

    <!-- PROMPTS -->
    <div id="prompts" class="tab hidden">

        <div class="header">
            <h1>البرومبتات</h1>
            <button class="btn primary" onclick="toggleForm()">+ إضافة</button>
        </div>

        <div id="form" class="form hidden">

            <input id="title" placeholder="العنوان">

            <input type="file" id="imageUpload">
            <input id="image" placeholder="رابط الصورة">

            <select id="category"></select>

            <textarea id="prompt" placeholder="البرومبت"></textarea>
            <textarea id="desc" placeholder="الوصف"></textarea>

            <select id="platform">
                <option>YouTube</option>
                <option>TikTok</option>
                <option>Instagram</option>
            </select>

            <input id="videoLink" placeholder="رابط الفيديو">
            <label><input type="checkbox" id="showHome"> عرض في الرئيسية</label>

            <button class="btn primary" onclick="addPrompt()">حفظ</button>
        </div>

        <div id="list" class="grid"></div>
    </div>

    <!-- CATEGORIES -->
    <div id="categories" class="tab hidden">
        <h1>الأقسام</h1>

        <div class="form">
            <input id="catName" placeholder="اسم القسم">
            <button class="btn primary" onclick="addCategory()">إضافة</button>
        </div>

        <div id="catList"></div>
    </div>

    <!-- NOTIFICATIONS -->
    <div id="notifications" class="tab hidden">
        <h1>الإشعارات</h1>

        <div class="form">
            <input id="notifTitle" placeholder="عنوان">
            <textarea id="notifDesc" placeholder="وصف"></textarea>
            <button class="btn primary" onclick="addNotification()">إضافة</button>
        </div>

        <div id="notifList"></div>
    </div>

</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>

</body>
</html>
